<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصتك الاحترافية - المطور محمد زلزال</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        
        body {
            background: linear-gradient(135deg, #0F172A, #1E293B);
            color: #E2E8F0;
            font-family: 'Cairo', sans-serif;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: #1E293B;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 2px solid #334155;
        }
        h2 {
            text-align: center;
            color: #FBBF24;
            margin-bottom: 10px;
            font-weight: 900;
        }
        .dev-badge {
            background: linear-gradient(135deg, #92400E, #D97706, #F59E0B);
            padding: 18px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 25px;
            border: 2px solid #FEF3C7;
            box-shadow: 0 5px 15px rgba(217, 119, 6, 0.4);
        }
        .dev-badge h3 {
            margin: 0 0 8px 0;
            color: #FEF3C7;
            font-size: 18px;
            font-weight: 900;
        }
        .dev-badge p {
            margin: 0;
            font-size: 14px;
            color: #FFFBEB;
            font-weight: bold;
        }
        .user-info {
            text-align: center;
            background: #0F172A;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #475569;
            font-size: 15px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 15px 0;
            font-size: 16px;
            font-weight: bold;
            color: #FFFFFF;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-decoration: none;
        }
        .btn-1 { background: linear-gradient(135deg, #92400E, #D97706, #F59E0B); }
        .btn-2 { background: linear-gradient(135deg, #1E3A8A, #2563EB, #3B82F6); }
        .btn-3 { background: linear-gradient(135deg, #065F46, #047857, #10B981); }
        .btn-download { background: linear-gradient(135deg, #7C3AED, #9333EA, #A855F7); }
        .btn:hover { opacity: 0.95; transform: translateY(-3px); }
        
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            padding: 15px;
            z-index: 1000;
        }
        .modal-content {
            background: #0F172A;
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 480px;
            border: 2px solid #64748B;
            color: #E2E8F0;
            text-align: right;
        }
        .modal-content h3 { color: #FBBF24; margin-top: 0; }
        .close-btn { background: #334155; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>منصتك الاحترافية الملكية 👑</h2>
    
    <div class="dev-badge">
        <h3>👑 المنصة الرسمية للمطور محمد زلزال</h3>
        <p>شغل عالي، دقة هندسية، وسيادة مطلقة في البرمجة وتصميم واجهات الأندرويد.</p>
    </div>

    <div class="user-info" id="userInfo">جاري تحميل بيانات المستخدم...</div>

    <button class="btn btn-1" onclick="openModal('modal1')">👑 الرتبة الملكية والمهام اليومية</button>
    <button class="btn btn-2" onclick="openModal('modal2')">🌟 بطاقة الإنجاز الفاخرة والمشاركة</button>
    <button class="btn btn-3" onclick="openModal('modal3')">🏆 لوحة الشرف الحية والديناميكية</button>
    
    <!-- زر تحميل التطبيق المباشر (يوجه لملف الـ APK الذي رفعته) -->
    <a href="base.apk" class="btn btn-download" download>📥 تحميل التطبيق الرسمي (APK)</a>
</div>

<div id="modal1" class="modal">
    <div class="modal-content">
        <h3>🛡️ غرفة المهام الملكية</h3>
        <p id="m1-body"></p>
        <button class="btn btn-1" onclick="doDailyTask()">⚡ تنفيذ المهمة اليومية (+50 نقطة)</button>
        <button class="btn close-btn" onclick="closeModal('modal1')">إغلاق الغرفة</button>
    </div>
</div>

<div id="modal2" class="modal">
    <div class="modal-content">
        <h3>🌟 بطاقة إنجازك الفاخرة</h3>
        <p id="m2-body"></p>
        <button class="btn btn-2" onclick="shareApp()">🚀 مشاركة البطاقة وكسب 25 نقطة</button>
        <button class="btn close-btn" onclick="closeModal('modal2')">إغلاق البطاقة</button>
    </div>
</div>

<div id="modal3" class="modal">
    <div class="modal-content">
        <h3>🏆 لوحة الشرف وأبطال المنصة</h3>
        <p id="m3-body"></p>
        <button class="btn close-btn" onclick="closeModal('modal3')">إغلاق لوحة الشرف</button>
    </div>
</div>

<script>
    function getData() {
        let uniqueId = localStorage.getItem("user_unique_id");
        if (!uniqueId) {
            uniqueId = "VIP_" + Math.floor(10000 + Math.random() * 90000);
            localStorage.setItem("user_unique_id", uniqueId);
        }
        let points = parseInt(localStorage.getItem("royal_user_points")) || 120;
        let tasks = parseInt(localStorage.getItem("completed_tasks_count")) || 2;
        let lastTaskTime = parseInt(localStorage.getItem("last_task_timestamp")) || 0;
        return { uniqueId, points, tasks, lastTaskTime };
    }

    function updateUI() {
        let data = getData();
        document.getElementById("userInfo").innerHTML = "👤 المعرّف: <b>#" + data.uniqueId + "</b> | ⭐ النقاط: <b>" + data.points + "</b>";
        document.getElementById("m1-body").innerHTML = "👤 المعرّف: " + data.uniqueId + "<br>⭐ نقاطك: " + data.points + " نقطة<br>🎯 المهام: " + data.tasks;
        document.getElementById("m2-body").innerHTML = "👤 المعرّف: " + data.uniqueId + "<br>⭐ النقاط: " + data.points + " نقطة";
        document.getElementById("m3-body").innerHTML = "🥇 المركز الأول: المطور محمد زلزال<br>🥈 المركز الثاني: " + data.uniqueId + "<br>⭐ نقاطك: " + data.points;
    }

    function openModal(modalId) { updateUI(); document.getElementById(modalId).style.display = "flex"; }
    function closeModal(modalId) { document.getElementById(modalId).style.display = "none"; }

    function doDailyTask() {
        let data = getData();
        let newPoints = data.points + 50;
        localStorage.setItem("royal_user_points", newPoints);
        alert("🎉 مبروك! حصلت على 50 نقطة.");
        updateUI();
        closeModal('modal1');
    }

    function shareApp() {
        let data = getData();
        let newPoints = data.points + 25;
        localStorage.setItem("royal_user_points", newPoints);
        alert("🎁 تم إضافة 25 نقطة بنجاح.");
        updateUI();
        closeModal('modal2');
    }

    window.onload = updateUI;
</script>
</body>
</html>
